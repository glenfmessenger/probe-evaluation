# Stage B configuration for the three-arm validation (branch `gates`). Thresholds live in GATES.md, not here.
models:                                  # the Phase 1 seven, in ascending cost order
  - meta-llama/Llama-3.2-1B-Instruct
  - google/gemma-3-1b-it
  - google/gemma-2-2b-it
  - meta-llama/Llama-3.2-3B-Instruct
  - google/gemma-3-4b-it
  - meta-llama/Llama-3.1-8B-Instruct
  - google/gemma-2-9b-it

dtype: bfloat16
feature: mlp_out          # GATES.md rule 5: the space every existing probe was trained in (PHASE2_REPORT 0.1)
modes: [raw, templated]   # templated = the model's own chat template (Phase 2 found it lifts plain-text AUC)
batch_size: 16
max_length: 1024
output_dir: results/gates
activations_dir: results/gates/activations     # gitignored

b1:                                       # ARM 1 — paired AF
  probe_dir: aase_vllm/pretrained/af      # the January probes supply layer_index and the Phase 1 comparison row
  rules: [paired, standard]               # paired = mean of within-pair differences; standard = difference of class means
  refusal_sample_per_set: 50              # HarmBench / XSTest / JBB prompts generated per model for refusal separation
  max_new_tokens: 64
  seed: 20260904

b2:                                       # ARM 2 — AAG extraction designs
  probe_dir: aase_vllm/pretrained/aag     # supplies layer_index per model
  designs: [final, mean, maxpos, oracle]
  seed: 20260904
  layer_check_designs: [oracle]           # 3-layer check, design (d) only, reported as a note
  layer_check_offsets_pct: [-0.15, 0.15]
  refusal_sample: 120                     # injection/benign prompts generated per model for refusal separation

b3:                                       # ARM 3 — APC external
  probe_dir: aase_vllm/pretrained/apc
  policy: medical
  primary_model: google/gemma-2-9b-it
  n_secondary_models: 2                   # the two best AF models from Arm 1, chosen by its reported AUC vs JBB benign
  rules: [paired, standard]
  seed: 20260904
